name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release notes list the commits since the previous build's tag.
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Restore development signing key
        env:
          ASTRA_DEBUG_KEYSTORE_B64: ${{ secrets.ASTRA_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$ASTRA_DEBUG_KEYSTORE_B64" ]; then
            echo 'Set ASTRA_DEBUG_KEYSTORE_B64 before building to preserve APK update compatibility.'
            exit 1
          fi
          keystore="$RUNNER_TEMP/astra-debug.keystore"
          printf '%s' "$ASTRA_DEBUG_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          # Same explicit override as desktop builds (android/app/build.gradle.kts);
          # the runner's default debug keystore location was not used for signing.
          echo "astra.debugKeystore=$keystore" >> android/local.properties
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub --no-fatal-infos
      - name: Test RetroArr, controller form, and source configuration
        run: >-
          flutter test --no-pub
          test/retroarr_provider_test.dart
          test/emulator_service_test.dart
          test/library_layout_test.dart
          test/recently_played_store_test.dart
          test/widgets/retroarr_source_form_test.dart
          test/source_resolver_test.dart
          test/source_model_test.dart
          test/sources_notifier_test.dart
          test/config_parser_test.dart
          test/provider_config_test.dart
      - name: Test System Files (RomDrop client, transfers, screens)
        run: >-
          flutter test --no-pub
          test/romdrop_models_test.dart
          test/romdrop_api_service_test.dart
          test/system_file_transfer_test.dart
          test/romdrop_controller_test.dart
          test/widgets/system_files_screens_test.dart
          test/widgets/romdrop_connection_screen_test.dart
          test/widgets/home_system_files_tile_test.dart
          test/widgets/settings_widgets_test.dart
      - name: Test folder games saved as one .zip
        run: >-
          flutter test --no-pub
          test/folder_packer_test.dart
          test/pack_folder_games_test.dart
          test/download_pack_folder_test.dart
      - name: Test the in-app update (release lookup, verified download, screen)
        run: >-
          flutter test --no-pub
          test/app_update_service_test.dart
          test/app_update_controller_test.dart
          test/widgets/app_update_screen_test.dart
      - name: Test that one Back from Android counts once
        run: flutter test --no-pub test/system_back_guard_test.dart
      - name: Build Astra APK
        # The run number becomes the Android version code, so a later build
        # always installs over an earlier one and the in-app updater can tell
        # which of two builds is newer.
        run: >-
          flutter build apk --debug --no-pub --target-platform android-arm64
          --build-number "$GITHUB_RUN_NUMBER"
      - name: Verify project signing key
        env:
          # Public certificate digest of the project development key.
          EXPECTED_CERT_SHA256: c1eb9b6f44fd1d3f722559e6f41f1f862e5a86e4ff0c2f7e346cd060069fcd49
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk | tee "$RUNNER_TEMP/signer.txt"
          if ! grep -q "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" "$RUNNER_TEMP/signer.txt"; then
            echo 'APK is not signed with the project development key; refusing to publish.'
            exit 1
          fi
      - name: Prepare download
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk astra-retro-debug.apk
          sha256sum astra-retro-debug.apk > astra-retro-debug.apk.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astra-retro-debug
          path: |
            astra-retro-debug.apk
            astra-retro-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="m1-build-${GITHUB_RUN_NUMBER}"
          previous="$(git describe --tags --abbrev=0 --match 'm1-build-*' 2>/dev/null || true)"
          {
            echo "Development build ${GITHUB_RUN_NUMBER} for ARM64 Android tablets, including the REDMAGIC Astra."
            echo
            echo "To install: in the app, open Settings, About, App update. Or download astra-retro-debug.apk in a browser on the tablet and open it."
            echo
            echo "Every build is signed with the same development key, so it updates the app in place and keeps its settings and downloads."
            echo
            echo "Changes in this build:"
            git log --no-merges --format='- %s' ${previous:+"${previous}..HEAD"} | head -n 40
          } > release-notes.md
          gh release create "$tag" astra-retro-debug.apk astra-retro-debug.apk.sha256 \
            --target "$GITHUB_SHA" --title "Development build ${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.md --latest
